# Input and output tasks
in_domains: angle-doppler-range
out_domains: angle-doppler-range
standardize_depth: False
extra_norm_pix_loss: False

# Architecture
model: pretrain_multimae_base
decoder_dim: 256
input_size: 128
# patch_size: 16
alphas: 1.0  # Dirichlet concentration parameter
num_encoded_tokens: 98 # Total would be 196 * 3 patches. 196 / 2 = 98
num_global_tokens: 1
decoder_use_task_queries: True
decoder_depth: 2

# Train
epochs: 50
opt: adamw
blr: 0.0001 # this is base_lr = 1e-4, lr = base_lr * batch_size / 256
warmup_lr: 0.000001 # 1e-6
min_lr: 0.
warmup_epochs: 0
batch_size: 256
hflip: 0.5
loss_on_unmasked: False
# fp32_output_adapters: semseg

# Data
heatmap_aug: True
data_path: '/data/sxu7/heatmaps/simulation/pretrain'

# Wandb logging
log_wandb: False # Set to True to log to Weights & Biases
# wandb_project: 'mmap_pretrain'
# wandb_run_name: mmap_sim_aug_100e_7w
# wandb_entity: null 

output_dir: 'output/pretrain/sim-aug_FINAL'

