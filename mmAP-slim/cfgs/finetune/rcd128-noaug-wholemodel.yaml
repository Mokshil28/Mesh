# Finetune from:
finetune: 'output/pretrain/sim-aug_FINAL/checkpoint-44.pth' 

# Task
in-domain: angle-doppler-range

# Model
model: multivit_base
use_mean_pooling: True
drop_path: 0.1

# Train
epochs: 20
opt: adamw
blr: 0.0005  # 5e-4
weight_decay: 0.05
warmup_epochs: 0
batch_size: 128
dist_eval: True
layer_decay: 0.65

# Data
heatmap_aug: False
data_set: heatmap
data_path: '/data/sxu7/heatmaps/recorded/finetune-cls128/train' 
eval_data_path: '/data/sxu7/heatmaps/recorded/finetune-cls128/eval'
nb_classes: 12

# # Wandb logging
log_wandb: False # Set to True to activate logging to Weights & Biases
# wandb_project: 'mmap_finetune'
# wandb_run_name: rcd128_aug_20e_5w
# wandb_entity: null

output_dir: 'output/finetune/rcd128-noaug-wholemodel'